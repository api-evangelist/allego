        url: authentication/allego-authentication.yml
      - type: ErrorCatalog
        url: errors/allego-problem-types.yml
      - type: Conventions
        url: conventions/allego-conventions.yml
  - aid: allego:allego-mcp-api-server
    name: Allego MCP API Server
    description: First-party hosted Model Context Protocol server shipped with Allego 9 that exposes Allego deal intelligence, content and enablement to any MCP-compatible AI copilot. Verified live at https://mcp.allego.com/mcp, which answers a JSON-RPC tools/list POST with HTTP 401 and an RFC 9728 WWW-Authenticate challenge; the tool catalog is OAuth-gated and was not enumerated.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.allego.com/platform/integrations/
