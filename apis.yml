apis:
  - aid: allego:allego-api
    name: Allego API
    description: REST API for the Allego sales enablement platform enabling programmatic access to video coaching sessions, content libraries, learning modules, certifications, rep readiness assessments, conversation intelligence, and deal intelligence data. The base URL is the surface Allego's own OAuth 2.0 Authorization Server Metadata names as its token and dynamic-registration host; it is session/OAuth gated and returns HTTP 401 with a vendor JSON error envelope to anonymous callers.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.allego.com/platform/integrations/
    baseURL: https://my.allego.com/rest/
    tags:
      - Sales Enablement
      - Video Coaching
      - Content Management
      - Certifications
      - Conversation Intelligence
    properties:
      - type: Documentation
        url: https://www.allego.com/platform/integrations/
