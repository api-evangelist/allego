name: Allego Well-Known Discovery Probe
description: >-
  Probe of RFC 8615 /.well-known/ discovery paths across every Allego host named in
  apis.yml plus the hosts discovered during contract discovery. Two real documents were
  served: the OAuth 2.0 Authorization Server Metadata (RFC 8414) and OAuth 2.0 Protected
  Resource Metadata (RFC 9728) published by the Allego MCP API Server at mcp.allego.com.
  Every other path 404d, 401d or 301-redirected to the marketing homepage. The 301s on
  www.allego.com are a WordPress catch-all that sends every unknown path to
  https://www.allego.com/ and are recorded as misses, not documents.
generated: '2026-08-14'
method: probed
source: live HTTPS probes of Allego hosts, 2026-08-14
hosts:
  - www.allego.com
  - my.allego.com
  - mcp.allego.com
  - api.allego.com
  - docs.allego.com
probes:
  - host: mcp.allego.com
    path: /.well-known/oauth-authorization-server
    url: https://mcp.allego.com/.well-known/oauth-authorization-server
    status: 200
    content_type: application/json
    document: true
    file: well-known/allego-mcp-oauth-authorization-server.json
    note: >-
      RFC 8414 Authorization Server Metadata. Names Allego's own authorization endpoint
      (my.allego.com/mcp/oauth2/authorize.do), token endpoint (my.allego.com/rest/oauth2/token)
      and an RFC 7591 dynamic client registration endpoint. PKCE S256 required.
  - host: mcp.allego.com
    path: /.well-known/oauth-protected-resource
    url: https://mcp.allego.com/.well-known/oauth-protected-resource
    status: 200
    content_type: application/json
    document: true
    file: well-known/allego-mcp-oauth-protected-resource.json
    note: >-
      RFC 9728 Protected Resource Metadata. Declares https://mcp.allego.com/mcp as the
      protected resource. scopes_supported is published as an empty array.
  - host: mcp.allego.com
    path: /.well-known/oauth-protected-resource/mcp
    url: https://mcp.allego.com/.well-known/oauth-protected-resource/mcp
    status: 200
    content_type: application/json
    document: true
    file: well-known/allego-mcp-oauth-protected-resource.json
    note: Identical body to /.well-known/oauth-protected-resource; the MCP-scoped alias.
